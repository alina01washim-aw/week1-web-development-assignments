<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="JavaScript form validation project by Alina Washim">

    <title>Form Validation | Alina Washim</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="form-card">

            <div class="form-header">

                <span class="eyebrow">
                    JAVASCRIPT PRACTICE
                </span>

                <h1>
                    Create your account
                </h1>

                <p>
                    A responsive form with client-side JavaScript
                    validation and clear user feedback.
                </p>

            </div>


            <form id="registrationForm" novalidate>

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                    <small
                        class="error-message"
                        id="nameError">
                    </small>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                    <small
                        class="error-message"
                        id="emailError">
                    </small>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="10-digit phone number"
                        maxlength="10"
                        autocomplete="tel"
                    >

                    <small
                        class="error-message"
                        id="phoneError">
                    </small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                    >

                    <small
                        class="password-hint">
                        Minimum 8 characters with uppercase,
                        lowercase, number, and special character.
                    </small>

                    <small
                        class="error-message"
                        id="passwordError">
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                    >

                    <small
                        class="error-message"
                        id="confirmPasswordError">
                    </small>

                </div>


                <!-- TERMS -->

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                    >

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>

                </div>

                <small
                    class="error-message"
                    id="termsError">
                </small>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-btn">
                    Create Account
                </button>


                <!-- SUCCESS -->

                <div
                    class="success-message"
                    id="successMessage">
                </div>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
